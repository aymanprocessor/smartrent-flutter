name: carbo
description: carbo

publish_to: "none"

version: 1.2.0+3

environment:
  sdk: ">=3.8.1 <4.4.0"
  flutter: 3.32.8

dependencies:
  flutter:
    sdk: flutter

  get: 4.7.2
  intl: ^0.20.2
  flutter_screenutil: ^5.9.3
  flutter_inappwebview: ^6.1.5
  webview_flutter: ^4.4.2
  get_storage: ^2.1.1
  flutter_svg: ^2.2.0
  r_dotted_line_border: ^0.1.1
  carousel_slider: ^5.1.1
  cached_network_image: 3.4.1
  image_picker: 1.1.2
  logger: ^2.6.1
  lottie: 3.3.1
  iconsax: ^0.0.8
  dropdown_button2: ^2.3.9
  restart_app: ^1.3.2
  dynamic_languages:
    git:
      url: https://github.com/appdevsx/dynamic_languages
      ref: main

  imageview360:
  loading_animation_widget: ^1.3.0

  flutter_animate: ^4.5.2
  device_preview: ^1.3.1
  pin_code_fields: ^8.0.1
  csv: ^6.0.0
  country_code_picker: ^3.0.0
  phone_numbers_parser: ^8.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  change_app_package_name: 1.5.0
  flutter_launcher_icons: 0.14.4
  rename_app: 1.6.5

flutter_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/logo/app_launcher.png"

flutter:
  uses-material-design: true
  assets:
    - assets/background/
    - assets/icons/
    - assets/logo/
