import java.util.Properties

plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
    id "com.google.gms.google-services"
}

def keystorePropertiesFile = rootProject.file("key.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace = "com.next.smartrent"
    compileSdk = flutter.compileSdkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_17.toString()
    }

    signingConfigs {
        release {
            storeFile = rootProject.file(keystoreProperties["storeFile"])
            storePassword = keystoreProperties["storePassword"]
            keyAlias = keystoreProperties["keyAlias"]
            keyPassword = keystoreProperties["keyPassword"]
        }
    }

    defaultConfig {
        applicationId = "com.next.smartrent"
        minSdk = flutter.minSdkVersion
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
        manifestPlaceholders = [
            'com.google.android.geo.API_KEY': project.hasProperty('MAPS_API_KEY') ? project.property('MAPS_API_KEY') : "AIzaSyDBtOCLLOaWvNjc5WPOQjBbHkSGSy3Y-9k",
            'applicationName': project.hasProperty('APPLICATION_NAME') ? project.property('APPLICATION_NAME') : "android.app.Application"
        ]
    }

    buildTypes {
        release {
            signingConfig = signingConfigs.release
            // Enable code shrinking and use the app-level ProGuard rules.
            // `minifyEnabled` is required to run R8; if it's already enabled
            // by another config, this keeps the behavior consistent and ensures
            // our `proguard-rules.pro` is applied.
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    aaptOptions {
        noCompress "tflite"  // Your model's file extension: "tflite", "lite", etc.
    }
}
dependencies {
    // Import the Firebase BoM
    implementation platform("com.google.firebase:firebase-bom:34.7.0")

    // Firebase Analytics
    implementation "com.google.firebase:firebase-analytics"

    // Firebase Messaging (handles instance ID internally)
    implementation "com.google.firebase:firebase-messaging"
    
    // Pusher Beams will use the pusher_beams Flutter plugin
    // Removed: implementation 'com.pusher:push-notifications-android:1.9.0'

    // Add language package you need to use
    implementation 'com.google.mlkit:text-recognition-chinese:16.0.0'
    implementation 'com.google.mlkit:text-recognition-devanagari:16.0.0'
    implementation 'com.google.mlkit:text-recognition-japanese:16.0.0'
    implementation 'com.google.mlkit:text-recognition-korean:16.0.0'
}

flutter {
    source = "../.."
}

